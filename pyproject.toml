[project]
name = "swarm-studio"
version = "0.1.0"
description = "Growth-race videos with tens of thousands of real balls (numba particle engine) and the social export pack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pygame-ce>=2.5",
]

[project.scripts]
swarm = "swarm_studio.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
